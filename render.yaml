services:
  - type: web
    name: ner-logistics-backend
    runtime: python
    rootDir: ner-logistics-ai-starter/ner-logistics-ai/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
